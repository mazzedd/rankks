<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">GRAND SLAM Tennis Logo</title>
  <desc id="desc">Original GRAND SLAM tennis-inspired logo with four colored court panels, a tennis ball, and bold wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#132b43"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="55%" stop-color="#d8a93a"/>
      <stop offset="100%" stop-color="#8e651c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="500" rx="36" fill="url(#bg)"/>

  <!-- Four Grand Slam-inspired court panels: hard, clay, grass, hard/night -->
  <g transform="translate(95 72)" filter="url(#shadow)">
    <path d="M94 0h238a38 38 0 0 1 38 38v238a38 38 0 0 1-38 38H94a94 94 0 0 1 0-314z" fill="#1e88e5"/>
    <path d="M294 0h238a38 38 0 0 1 38 38v238a38 38 0 0 1-38 38H294z" fill="#c96a2c"/>
    <path d="M494 0h238a38 38 0 0 1 38 38v238a38 38 0 0 1-38 38H494z" fill="#2e7d32"/>
    <path d="M694 0h238a94 94 0 0 1 0 314H694z" fill="#263a90"/>

    <!-- Court line motif -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.78" stroke-width="8" stroke-linecap="round">
      <path d="M92 66h840"/>
      <path d="M92 248h840"/>
      <path d="M220 66v182"/>
      <path d="M406 66v182"/>
      <path d="M592 66v182"/>
      <path d="M778 66v182"/>
      <path d="M92 157h840" stroke-opacity="0.38"/>
    </g>

    <!-- Golden tennis ball / slam emblem -->
    <g transform="translate(420 13)">
      <circle cx="86" cy="144" r="93" fill="url(#gold)" stroke="#fff2bd" stroke-width="8"/>
      <path d="M34 73c52 34 52 108 0 142" fill="none" stroke="#fff7cf" stroke-width="13" stroke-linecap="round"/>
      <path d="M138 73c-52 34-52 108 0 142" fill="none" stroke="#7b5a16" stroke-opacity="0.5" stroke-width="13" stroke-linecap="round"/>
      <path d="M86 44l14 42 44 .2-35 26 13 42-36-25-36 25 13-42-35-26 44-.2z" fill="#07111f" opacity="0.16"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g text-anchor="middle">
    <text x="600" y="420" font-family="Montserrat, Poppins, Arial Black, Arial, sans-serif" font-size="94" font-weight="900" letter-spacing="8" fill="#f8fbff">GRAND SLAM</text>
    <text x="600" y="455" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="10" fill="#d8a93a">TENNIS MAJORS</text>
  </g>
</svg>
